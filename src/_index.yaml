version: "1.0"
namespace: chicago.taskman

# Task Manager: a window on the shell SDK that shows the runtime itself: open
# windows, processes, memory and goroutines over time, the node and the
# cluster.
#
# The window takes the numbers itself, with the `system` module, under its
# own permissions. There is no CPU load in percent on purpose: the runtime
# does not compute it, and the window is not allowed to read `/proc`. The
# honest load of the runtime is goroutines and the heap.
#
# Two desktop widgets, Memory and Goroutines, show the same two figures at a
# glance and open the window on a click (the last section of this file).
#
# Keep the comments of this file free of an unquoted colon followed by a
# space inside a meta.comment — it breaks the parse of the whole index.

entries:
  - name: definition
    kind: ns.definition
    meta:
      title: Task Manager
      description: Task Manager for the Chicago desktop — open windows, runtime processes, memory and goroutines over time and the node, for administrators; the Memory and Goroutines desktop widgets open it on a click.

  # ─── Dependencies ────────────────────────────────────────────────────
  # The shell and the base are resolved from their GitHub repositories by
  # tag — `component` names the repository, the module keeps its own name
  # (chicago/shell, chicago/tui-desktop) in the lock. A compatibility range,
  # never an exact version: the lock holds the exact one, and the range says
  # what the module was written against (v0.2.0 is the first tag of both).
  - version: ">=0.2.0"
    name: dep.chicago.shell
    kind: ns.dependency
    meta:
      comment: The Chicago shell — the window SDK and its charts, the runtime facts library the window reads, and the resolver of the module's image pack.
    component: github.com/chicago-desktop/shell

  - version: ">=0.2.0"
    name: dep.chicago.tui_desktop
    kind: ns.dependency
    meta:
      comment: The desktop base — the compositor that lists the open windows, closes one on End Task, and asks meta.requires before opening Task Manager.
    component: github.com/chicago-desktop/tui-desktop

  # chicago.taskman:images
  #
  # The shell finds an image pack in the registry by its meta.type and names a
  # picture `<entry>/<file>`: `chicago.taskman:images/taskmgr`. PNG in 32/
  # and 16/ under assets/images; packed only because wippy.yaml lists the
  # entry under `embed:`. The windows on the Applications tab bring their
  # own pictures with the compositor's list.
  - name: images
    kind: fs.directory
    meta:
      type: chicago.images
      comment: "Task Manager's pictures — the taskmgr icon at 32 and 16 px, an image pack of the shell."
    base: module
    directory: ./assets/images
    auto_init: false

  # chicago.taskman:model
  - name: model
    kind: library.lua
    meta:
      comment: Task Manager, pure model — measurement history, formats, stable process sorting; the graph and the ceiling come from the SDK.
    source: file://model.lua
    imports:
      geometry: chicago.tui_desktop.desktop:geometry
      charts: chicago.shell.sdk:charts

  # Permissions: read the runtime (`system.read`: hosts, node, cluster), ask
  # the compositor about open windows, publish its state and close a window
  # (End Task), and terminate a process (End Process, owner's decision
  # 2026-09-14). End Process warns first, and the shell and the Task Manager
  # itself are not offered; the window still starts nothing.
  - name: window_scope
    kind: security.policy
    meta:
      comment: Task Manager permissions — read the runtime state, ask the compositor, close a window and terminate a process on the person's confirmation.
    policy:
      actions:
        - process.context
        - process.registry
        - process.send
        - process.terminate
        - system.read
      resources: "*"
      effect: allow

  # chicago.taskman:window
  - name: window
    kind: process.lua
    meta:
      type: tui_desktop.window
      title: Task Manager
      # Ends any runtime process, other people's desktops' among them: only
      # for chicago.admin.
      requires: chicago.admin
      image: chicago.taskman:images/taskmgr
      icon: "▥"
      group: Settings
      order: 120
      window_type: app
      resizable: true
      width: 78
      height: 27
      pixel_render: chicago.shell.sdk:render
      pixel_state: chicago.taskman:window
      comment: Task Manager — open windows, runtime processes, memory and goroutines over time, the node; refreshes once a second; a window on the shell SDK.
    source: file://window.lua
    method: main
    modules:
      - os
      - process
      - system
    security:
      policies: [chicago.taskman:window_scope]
    imports:
      geometry: chicago.tui_desktop.desktop:geometry
      app: chicago.shell.sdk:app
      desktop: chicago.tui_desktop.desktop:window_api
      model: chicago.taskman:model
      charts: chicago.shell.sdk:charts
      facts: chicago.shell.config:system
      ui: chicago.shell.sdk:ui

  # ─── The desktop widgets ─────────────────────────────────────────────
  # Two widgets on the shell's desktop (FR-006, the shell's docs/sdk.md,
  # "Desktop widgets") — the heap and the goroutines, a sample every 2 s,
  # two minutes of history. They read the runtime the same way the window
  # does (`chicago.shell.config:system`) and open it on a click. They have no
  # network, no database and no files.
  #
  # The shell reads the widget entries at start and on `desktop.refresh`, so
  # a new entry appears on the desktop after the shell restarts.

  # chicago.taskman:sample
  - name: sample
    kind: library.lua
    meta:
      comment: "A ring of 60 samples, a round ceiling, one sample of a runtime figure and the trees of both widgets; a refusal is a label, not a zero."
    source: file://sample.lua
    imports:
      facts: chicago.shell.config:system
      charts: chicago.shell.sdk:charts
      gadget: chicago.shell.sdk:gadget

  # chicago.taskman:widget_scope
  #
  # `system.read` for the runtime's figures; the rest is the conversation
  # with the compositor — find it by the name from the process context and
  # publish the tree. Nothing more, a widget starts nothing and stops no one.
  # It is far narrower than window_scope, and so the widgets name no
  # `requires` and stand on every desktop; the click opens the window only
  # for a person the window's own `requires` admits.
  - name: widget_scope
    kind: security.policy
    meta:
      comment: "The desktop widgets — read the runtime's figures and publish a tree to the compositor; start nothing."
    policy:
      actions:
        - system.read
        - process.context
        - process.registry
        - process.send
      resources: "*"
      effect: allow

  # chicago.taskman:memory
  #
  # The `system` module is deliberately not declared here — the `facts`
  # library declares it, and the `system.read` right is this entry's policy.
  - name: memory
    kind: process.lua
    meta:
      type: chicago.widget
      title: Memory
      width: 20
      height: 8
      order: 20
      opens: chicago.taskman:window
      comment: "Widget — the runtime's heap now and over two minutes; a click opens Task Manager."
    source: file://memory.lua
    method: main
    imports:
      app: chicago.shell.sdk:app
      sample: chicago.taskman:sample
    security:
      policies: [chicago.taskman:widget_scope]

  # chicago.taskman:goroutines
  - name: goroutines
    kind: process.lua
    meta:
      type: chicago.widget
      title: Goroutines
      width: 20
      height: 9
      order: 30
      opens: chicago.taskman:window
      comment: "Widget — the runtime's goroutine count now and over two minutes; a click opens Task Manager."
    source: file://goroutines.lua
    method: main
    imports:
      app: chicago.shell.sdk:app
      sample: chicago.taskman:sample
    security:
      policies: [chicago.taskman:widget_scope]
